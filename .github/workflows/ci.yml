name: CI

# Untrusted-safe validation: this workflow runs on pull requests (including
# forks) and must stay secretless. Live-API integration tests live in
# integration.yml, which runs only on trusted pushes and holds the
# TYPESAFE_API_KEY environment secret. Do not add secrets or a
# pull_request_target trigger here.
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go-version: ['1.27.x', stable]
        include:
          # One run each on the other supported platforms; the dev environment
          # is Windows, and path and clock handling differ enough to be worth
          # a build there.
          - os: windows-latest
            go-version: stable
          - os: macos-latest
            go-version: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Verify module dependencies
        run: go mod verify
      # The race detector needs cgo, which is not reliably available on the
      # Windows runner; that platform gets a plain run.
      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Build examples
        run: go build ./...

  zero-deps:
    name: Zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      # The zero-dependency promise is a contract, so prove it rather than
      # trusting review. `go mod tidy -diff` and `go mod verify` (test job)
      # only prove the module file is consistent; this job proves the actual
      # invariant: no module other than the SDK itself, and no directives in
      # go.mod that could smuggle one in later.
      - name: Assert no external Go module dependencies
        run: |
          set -euo pipefail
          deps="$(go list -m -f '{{if not .Main}}{{.Path}}{{end}}' all | sed '/^$/d')"
          if [ -n "$deps" ]; then
            echo "::error::This SDK must remain stdlib-only (zero runtime dependencies)."
            echo "Unexpected external modules:"
            echo "$deps"
            exit 1
          fi
          if grep -nE '^(require|replace|exclude|tool)[ (]' go.mod; then
            echo "::error::go.mod must contain only module and go directives."
            exit 1
          fi
          echo "Zero-dependency invariant satisfied."

  lint:
    name: Staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      # Run as a tool dependency rather than a module requirement, so the SDK
      # itself keeps zero dependencies.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

  vulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
